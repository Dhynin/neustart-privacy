# Für einen bereits laufenden Apache auf dem Host.
# Benötigt: a2enmod proxy proxy_http headers ssl
# 1. cp deploy/apache-chat.ums-photo.de.conf /etc/apache2/sites-available/chat.ums-photo.de.conf
# 2. a2ensite chat.ums-photo.de && apache2ctl configtest && systemctl reload apache2
# 3. Zertifikat: certbot --apache -d chat.ums-photo.de  (legt den :443-VirtualHost an)
<VirtualHost *:80>
    ServerName chat.ums-photo.de

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/ timeout=180
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    LimitRequestBody 524288
    # Kein Access-Log: Request-Bodies enthalten Chat-Ausschnitte (Bodies loggt Apache ohnehin nicht).
    CustomLog /dev/null common
    ErrorLog ${APACHE_LOG_DIR}/chat.ums-photo.de-error.log
</VirtualHost>

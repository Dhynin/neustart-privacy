# Für einen bereits laufenden nginx auf dem Host.
# 1. Datei nach /etc/nginx/sites-available/ kopieren und nach sites-enabled verlinken
# 2. Zertifikat holen:  certbot --nginx -d chat.ums-photo.de
# 3. nginx -t && systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name chat.ums-photo.de;

    client_max_body_size 512k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
